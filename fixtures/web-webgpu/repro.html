<!doctype html><meta charset="utf-8"><title>Plain-JS WebGPU canvas loss repro</title>
<p>Plain JavaScript, no Rust: <code>fixtures/web-webgpu-probe/canvas-loss.js</code> and <code>canvas-readback.js</code>. Takes about 4 s.</p>
<pre id="out">Running</pre>
<script type="module">
const out = document.getElementById('out');
const run = async name => { try { return await (0, eval)(await (await fetch('/probe/' + name)).text()); } catch (e) { return 'threw: ' + e; } };
const result = {userAgent: navigator.userAgent, secureContext: isSecureContext, navigatorGpu: 'gpu' in navigator,
  canvasLoss: await run('canvas-loss.js'), canvasReadback: await run('canvas-readback.js')};
out.textContent = JSON.stringify(result, null, 2);
</script>
