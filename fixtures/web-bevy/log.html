<!doctype html><meta charset="utf-8"><title>Persisted logs (no Wasm, no WebGPU)</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px monospace}pre{white-space:pre-wrap;padding:8px}</style>
<p>Static page: reads localStorage only. It loads no Wasm and makes no WebGPU calls.</p>
<button id="copy">Copy</button><pre id="out"></pre>
<script>
const text = JSON.stringify({bevyView: JSON.parse(localStorage.getItem('rnrs-web-bevy-log') ?? 'null'),
  teardownProbe: JSON.parse(localStorage.getItem('rnrs-teardown-probe-log') ?? 'null'), at: new Date().toISOString()}, null, 2);
document.getElementById('out').textContent = text;
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(text);
</script>
