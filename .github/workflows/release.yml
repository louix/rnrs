# Stages verified artifacts with provenance. Publication requires npm approval with 2FA.
# Configure the trusted publisher for stage-publish only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Stage on npm for 2FA approval (only from a v* tag; otherwise a dry run)
        type: boolean
        default: false

permissions: {}

# One run per ref: a manual dry run on main never displaces a queued tag release.
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ios: true
    permissions:
      contents: read

  build:
    name: Build and verify the release tarballs
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact: `npm pack` output must not change when a release is rebuilt to resume it.
          node-version: '24.21.0'
          package-manager-cache: false # no caches in release builds
      - name: Source commit
        id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/runtime/package.json").version')"
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ]
            # Releases come from main's history only.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "::error::$tag ($GITHUB_SHA) is not on main"; exit 1; }
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release $tag from $GITHUB_SHA ($REF_TYPE $REF_NAME)"
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - name: Pack and check
        run: node scripts/release.mjs check --dir .generated/release
      - name: Plan against the registry
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: node scripts/release.mjs plan --dir .generated/release --tag "$TAG" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: |
            .generated/release/rnrs-cli-*.tgz
            .generated/release/rnrs-runtime-*.tgz
            .generated/release/rnrs-surface-*.tgz
            .generated/release/release.json
            .generated/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  dry-run:
    name: npm stage publish --dry-run
    needs: build
    if: ${{ !(github.ref_type == 'tag' && (github.event_name == 'push' || inputs.stage)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist
      - env:
          TAG: ${{ needs.build.outputs.tag }}
        run: node scripts/release.mjs stage --dir dist --tag "$TAG" --sha "$GITHUB_SHA" --dry-run

  stage:
    name: Stage on npm (approval required)
    needs: build
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.stage) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist
      - name: Stage the verified tarballs (cli, runtime, surface)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/release.mjs stage --dir dist --tag "$TAG" --sha "$GITHUB_SHA"

  github-release:
    name: Create GitHub Release
    needs: [build, stage]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release with changelog and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # Keep an existing release and any manually edited notes on workflow retries.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          notes="$RUNNER_TEMP/rnrs-release-notes.md"
          awk -v heading="## ${TAG#v}" '
            /^## / { if (found) exit; if ($0 == heading) { found=1; next } }
            found { print }
          ' CHANGELOG.md > "$notes"
          echo 'npm publication requires separate approval on npm with 2FA.' >> "$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --generate-notes --notes-file "$notes"
