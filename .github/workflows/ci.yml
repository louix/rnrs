# Pull requests, manual runs and release tags (through release.yml); no runs on ordinary pushes.
# Each job sets up its environment and runs one script that is also the local command
# (docs/development.md#ci). Physical-device suites stay manual.
# Actions are pinned to commit SHAs (tag in the comment); update them deliberately, at least
# 14 days after their release.
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Build and run the iOS simulator consumer
        type: boolean
        default: true
  workflow_call:
    inputs:
      ios:
        type: boolean
        default: true

permissions: {}

concurrency:
  # Called from the release workflow, github.workflow is the caller's name: its own group.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: '1.90.0'

jobs:
  host:
    name: Lint, types, tests, release check, Rust and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          shell: host
      - uses: ./.github/actions/rust-cache
        with:
          key: host
      - run: npm ci --ignore-scripts
      - shell: nix develop .#host --command bash -euo pipefail {0}
        run: bash scripts/ci/host.sh

  web:
    env:
      # Disposable hosted runner; Nix Chromium cannot use its setuid helper here.
      RNRS_WEB_NO_SANDBOX: '1'
    name: Browser harness and clean web consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          shell: web
      - uses: ./.github/actions/rust-cache
        with:
          key: web
      - run: npm ci --ignore-scripts
      - shell: nix develop .#web --command bash -euo pipefail {0}
        run: bash scripts/ci/web.sh

  android:
    name: Clean Android consumer build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Free disk space (preinstalled SDKs this job does not use)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          shell: default
      - uses: ./.github/actions/rust-cache
        with:
          key: android
          gradle: true
      - run: npm ci --ignore-scripts
      - shell: nix develop --command bash -euo pipefail {0}
        run: bash scripts/ci/android.sh

  ios:
    name: Clean iOS simulator consumer
    # Every pull request; manual runs can skip it.
    if: github.event_name == 'pull_request' || inputs.ios
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: ./.github/actions/rust-cache
        with:
          key: ios
      - run: npm ci --ignore-scripts
      - run: bash scripts/ci/ios.sh
