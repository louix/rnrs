name: Nix shell
description: Install Nix, restore the Nix store cached for one flake shell, and realise that shell.
inputs:
  shell:
    description: The flake devShell (default, host, web)
    required: true
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ github.token }}
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ inputs.shell }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ inputs.shell }}-
        gc-max-store-size-linux: 6G
    - name: Realise the shell
      shell: bash
      env:
        SHELL_NAME: ${{ inputs.shell }}
      run: nix develop ".#$SHELL_NAME" --command true
