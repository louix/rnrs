name: Rust and Gradle caches
description: >
  Restore the repository's isolated rustup toolchains and cargo downloads (.generated/rustup,
  .generated/cargo; scripts/rust-env.sh) and optionally Gradle's (.generated/gradle).
  Build outputs are not cached.
inputs:
  key:
    description: Cache name (one per job)
    required: true
  gradle:
    description: Also cache .generated/gradle
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          .generated/rustup
          .generated/cargo/registry/index
          .generated/cargo/registry/cache
          .generated/cargo/git/db
        key: rust-${{ runner.os }}-${{ inputs.key }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/rnrs-*.Cargo.lock', 'packages/*/rust/Cargo.toml', 'packages/fixtures/*/rust/Cargo.toml') }}
        restore-keys: rust-${{ runner.os }}-${{ inputs.key }}-${{ env.RUSTUP_TOOLCHAIN }}-
    - if: inputs.gradle == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          .generated/gradle/caches
          .generated/gradle/wrapper
        key: gradle-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('packages/runtime/android/build.gradle', 'packages/surface/android/build.gradle', 'scripts/consumer/rn-app.sh') }}
        restore-keys: gradle-${{ runner.os }}-${{ inputs.key }}-
