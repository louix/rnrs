// The lab is an npm workspace: packages install into the repository root's node_modules.
pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    def repo = new File(settings.rootDir, "../../..").canonicalFile
    ex.autolinkLibrariesFromCommand(
        ["node", new File(repo, "node_modules/@react-native-community/cli/build/bin.js").path, "config"],
        new File(settings.rootDir, ".."),
        settings.layout.rootDirectory.files("../package.json", "../react-native.config.js", "../../../package-lock.json"))
}
rootProject.name = 'HelloWorld'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')
