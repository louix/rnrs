org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.workers.max=4
android.useAndroidX=true
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false
# The lab drives the framework test hooks (scope invalidation, forced copy fallback) from JS.
rnrs.testHooks=true
# AGP 9 (React Native 0.88): keep the Kotlin Gradle plugin and the legacy DSL, as the 0.88
# template does; the framework libraries apply org.jetbrains.kotlin.android.
android.builtInKotlin=false
android.newDsl=false
