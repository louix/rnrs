// @rnrs/runtime Android library: lifecycle TurboModule (codegen spec in ../src/specs), the
// generic JSI adapter (librnrs.so), and the app's Rust modules. Applications add nothing:
// autolinking includes this project, and the rnrsLinkModules task below links the modules found
// in the app's npm dependencies: their prebuilt binaries, or (only for modules the app lists in
// rustNativeApp.sourceBuild) a source bundle built with cargo.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def ext(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

// <app>/android is the Gradle root; the app's package.json is one level up.
def appRoot = rootProject.projectDir.parentFile
def rnrsOut = new File(appRoot, ".rnrs/android")
def architectures = (rootProject.findProperty("reactNativeArchitectures") ?: "armeabi-v7a,x86,x86_64,arm64-v8a").split(",").collect { it.trim() }
def minSdk = ext("minSdkVersion", 24)
// Native test hooks (scope invalidation, forced GC, forced copy fallback) are compiled only
// for device test harnesses: Gradle property rnrs.testHooks=true or RNRS_TEST_HOOKS=1.
def testHooks = rootProject.findProperty("rnrs.testHooks") == "true" || System.getenv("RNRS_TEST_HOOKS") == "1"
// Attribution counters: -Prnrs.diagnostics=true. Never for measurements.
def diagnostics = rootProject.findProperty("rnrs.diagnostics") == "true"

android {
  namespace "dev.rustjsilab.rnrs"
  compileSdk ext("compileSdkVersion", 37)
  ndkVersion ext("ndkVersion", "27.1.12297006")
  if (rootProject.ext.has("buildToolsVersion")) buildToolsVersion rootProject.ext.buildToolsVersion

  defaultConfig {
    minSdkVersion minSdk
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DRNRS_LINK_DIR=${rnrsOut.absolutePath}",
            "-DRNRS_TEST_HOOKS=${testHooks ? "ON" : "OFF"}", "-DRNRS_DIAGNOSTICS=${diagnostics ? "ON" : "OFF"}"
        abiFilters(*architectures)
      }
    }
  }
  externalNativeBuild {
    cmake { path "CMakeLists.txt"; version "3.22.1" }
  }
  buildFeatures { prefab true }
  packagingOptions {
    // Provided by react-android / the app.
    excludes = ["**/libc++_shared.so", "**/libfbjni.so", "**/libjsi.so", "**/libreactnative.so"]
  }
  sourceSets {
    main { java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"] }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}

def triples = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7-linux-androideabi", "x86": "i686-linux-android", "x86_64": "x86_64-linux-android"]
def clangPrefix = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7a-linux-androideabi", "x86": "i686-linux-android", "x86_64": "x86_64-linux-android"]

// Checks the prebuilt binaries of the app's modules (from its dependency graph) and writes the
// module registry and archive list for CMake; needs only node (-Prnrs.node=/path/to/node or
// NODE_BINARY selects another). Modules listed in the app's rustNativeApp.sourceBuild are built
// from source into one bundle per ABI, which also needs cargo and the Rust Android targets
// (rustup target add ...; RNRS_CARGO selects another cargo) and uses the app's
// rnrs-android.Cargo.lock (created on the first build if absent; CI: -Prnrs.locked=true or
// RNRS_LOCKED=1 fails if it is missing or stale). Without such modules cargo never runs.
// Always runs (conservative: the selection lives in package.json and node_modules): the node
// step rewrites its outputs only when they change, and cargo decides what is up to date.
def rnrsLinkModules = tasks.register("rnrsLinkModules", Exec) {
  group = "rnrs"
  description = "Link the app's Rust modules (prebuilt binaries; source builds where selected)"
  workingDir appRoot
  if (diagnostics) environment "RNRS_BUNDLE_FEATURES", "rnrs-android/diagnostics"
  doFirst {
    def ndk = android.ndkDirectory
    def host = System.getProperty("os.name").toLowerCase().contains("mac") ? "darwin-x86_64" : "linux-x86_64"
    def bin = new File(ndk, "toolchains/llvm/prebuilt/${host}/bin")
    architectures.each { abi ->
      def triple = triples[abi]
      def key = triple.replace("-", "_")
      // C sources of module dependencies (for example blake3's SIMD code) use the NDK clang.
      environment "CC_${key}", new File(bin, "${clangPrefix[abi]}${minSdk}-clang").absolutePath
      environment "AR_${key}", new File(bin, "llvm-ar").absolutePath
      environment "CARGO_TARGET_${key.toUpperCase()}_LINKER", new File(bin, "${clangPrefix[abi]}${minSdk}-clang").absolutePath
    }
  }
  def locked = rootProject.findProperty("rnrs.locked") == "true" ? ["--locked"] : []
  // The node executable: Gradle property rnrs.node, else NODE_BINARY (as React Native's iOS
  // scripts use), else `node` on PATH. Passed as one argument, so paths with spaces work.
  def node = (rootProject.findProperty("rnrs.node") ?: System.getenv("NODE_BINARY") ?: "node").toString()
  doFirst {
    if (node.contains(File.separator) && !new File(node).isAbsolute())
      throw new GradleException("rnrs: node executable '${node}' (from -Prnrs.node or NODE_BINARY) must be an absolute path or a command name on PATH")
    if (new File(node).isAbsolute() && !new File(node).canExecute())
      throw new GradleException("rnrs: node executable '${node}' (from -Prnrs.node or NODE_BINARY) does not exist or is not executable")
  }
  commandLine([node, new File(projectDir, "../cli/run.mjs").absolutePath, "build", "--target", "android",
      "--app", appRoot.absolutePath, "--out", rnrsOut.absolutePath, "--abi", architectures.join(","),
      "--min-sdk", minSdk.toString()] + locked)
}
preBuild.dependsOn rnrsLinkModules
// CMake configure/build tasks are not necessarily ordered after preBuild; make
// the link step a direct prerequisite. (An IDE sync can configure CMake without this task; the
// CMake script then warns instead of failing, and the first Gradle build runs the task.)
tasks.configureEach { task ->
  if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) task.dependsOn rnrsLinkModules
}
