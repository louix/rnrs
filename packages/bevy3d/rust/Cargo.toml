[package]
name = "rnrs-bevy3d"
version = "0.4.0"
edition = "2021"
# Bevy requires Rust 1.97.1; build the app bundle with this toolchain.
rust-version = "1.97.1"
description = "A Bevy scene rendered offscreen and presented with wgpu through rnrs-surface."

[dependencies]
rnrs-core = "0.4"
rnrs-surface = "0.4"
log = "0.4"
# Enable the plugins for a lit cube and touch input. rnrs supplies the surface and logging.
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_mesh", "bevy_camera", "bevy_asset", "touch"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

# Select a GPU backend for each target: Metal, Vulkan or WebGPU.
[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(not(any(target_os = "ios", target_arch = "wasm32")))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }

# Browser rendering runs on the main thread through requestAnimationFrame.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["webgpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "Navigator", "Performance", "Window"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"

# Bevy's Android dependency requires an activity backend. See android_main in lib.rs.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
