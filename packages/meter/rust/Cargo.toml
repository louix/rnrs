[package]
name = "meter"
version = "0.4.0"
edition = "2021"
description = "Second example module implementation (packages/meter/meter.spec.ts): plain Rust."

[dependencies]
rnrs-core = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47", default-features = false, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["time", "rt", "macros", "test-util"] }
