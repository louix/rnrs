[package]
name = "rnrs-http"
version = "0.2.0"
edition = "2021"
description = "HTTP module implementation for @rnrs/example-http (wraps reqwest)."

[dependencies]
rnrs-core = "0.2"
futures-util = { version = "0.3", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
tokio = { version = "1.47", default-features = false, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["time", "rt-multi-thread", "macros", "net", "io-util"] }
