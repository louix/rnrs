[package]
name = "log-probe"
version = "0.4.0"
edition = "2021"
description = "Lab-only fixture for the Rust logging smoke: plain tracing and log calls, no platform code."

[dependencies]
rnrs-core = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
log = "0.4"

[dev-dependencies]
rnrs-log = { path = "../../../../rust/rnrs-log" }
