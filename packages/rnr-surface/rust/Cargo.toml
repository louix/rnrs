[package]
name = "rnr-surface"
version = "0.1.0"
edition = "2021"
description = "Framework rendering surfaces for @rnrs/surface: opaque surface keys, platform window attachment, leases and lifecycle; renderers depend on it by version."

[dependencies]
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle = { version = "0.6.2", features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
