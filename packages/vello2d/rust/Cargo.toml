[package]
name = "rnrs-vello2d"
version = "0.4.0"
edition = "2021"
description = "2D renderer module for @rnrs/example-vello2d: Vello CPU raster presented with wgpu on an rnrs-surface."

[dependencies]
rnrs-core = "0.4"
rnrs-surface = "0.4"
# Rasterize on the CPU, then upload and present with wgpu.
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
log = "0.4"

# Native presentation uses Metal on iOS and Vulkan on Android.
# Browsers use the canvas presenter in web_render.rs.
[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(all(not(target_os = "ios"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }

[dev-dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
