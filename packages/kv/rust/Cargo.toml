[package]
name = "rnr-kv"
version = "0.1.0"
edition = "2021"
description = "Key-value module implementation for @rnrs/example-kv (wraps sled; Android and iOS)."

[dependencies]
rnr-core = "0.1"
sled = "0.34"
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
