# Minimal direct wasm-bindgen binding of the comparison's scalar and numeric-array operations
# (no rnrs): the browser page's "wasm" path. Same wasm-bindgen pin and release profile as the
# rnrs web bundle (tools/rnrs-gen/bundle.mjs: opt-level 3, panic abort).
[package]
name = "cmp-wasm-direct"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
panic = "abort"

# Standalone (not a member of the repository workspace).
[workspace]
