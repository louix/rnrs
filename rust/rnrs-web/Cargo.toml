[package]
name = "rnrs-web"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/louix/rnrs"
# Shipped inside the @rnrs npm packages; not published to crates.io.
publish = false
description = "Framework browser backend: wasm-bindgen adapter and Env for generated module glue."

[features]
diagnostics = ["rnrs-core/diagnostics"]

[dependencies]
rnrs-core = { path = "../rnrs-core" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.106"
