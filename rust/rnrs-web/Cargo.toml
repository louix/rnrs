[package]
name = "rnrs-web"
version = "0.1.0"
edition = "2021"
description = "Framework browser backend: wasm-bindgen adapter and Env for generated module glue."

[features]
diagnostics = ["rnrs-core/diagnostics"]

[dependencies]
rnrs-core = { path = "../rnrs-core" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.106"
