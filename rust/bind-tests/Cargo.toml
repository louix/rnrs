[package]
name = "bind-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host tests of generated glue against a deterministic mock JS environment."

[dependencies]
rnrs-core = { path = "../rnrs-core", features = ["tokio"] }
counter = { path = "../../packages/counter/rust" }
meter = { path = "../../packages/meter/rust" }
values = { path = "../../packages/values/rust" }
rnrs-blake3 = { path = "../../packages/blake3/rust" }
rnrs-http = { path = "../../packages/http/rust" }
rnrs-kv = { path = "../../packages/kv/rust" }
rnrs-bench = { path = "../../packages/bench/rust" }
blake3 = "1.8"
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time"] }

[build-dependencies]
rnrs-build = { path = "../rnrs-build" }
