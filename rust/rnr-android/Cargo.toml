[package]
name = "rnr-android"
version = "0.1.0"
edition = "2021"
description = "Framework Android backend: generic C ABI between the JSI adapter (C++) and generated module glue."

[features]
diagnostics = ["rnr-core/diagnostics"]

[dependencies]
rnr-core = { path = "../rnr-core", features = ["tokio"] }
