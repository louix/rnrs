# Repository workspace: the lab, the framework crates and the example module packages.
# Module crates depend on `rnrs-core = "0.3"` or `rnrs = "0.3"` like any published dependency;
# this workspace (and every generated per-app bundle) patches them to the framework's copies.
[workspace]
members = [
  "rust/rnrs-core",
  "rust/rnrs-android",
  "rust/rnrs-web",
  "rust/rnrs-build",
  "rust/rnrs-log",
  "rust/rnrs",
  "rust/bind-tests",
  "packages/counter/rust",
  "packages/meter/rust",
  "packages/values/rust",
  "packages/blake3/rust",
  "packages/http/rust",
  "packages/kv/rust",
  "packages/bench/rust",
  "packages/fixtures/log-probe/rust",
  "packages/fixtures/worklets-probe/rust",
  "packages/surface/rust",
  "packages/vello2d/rust",
  "packages/fixtures/touch-probe/rust",
  "packages/fixtures/webgpu-triangle/rust",
]
# Scratch consumers and author packages built by scripts/consumer are standalone.
# packages/bevy3d needs Rust 1.97.1 (Bevy 0.20), above the workspace toolchain; built per app.
exclude = [".generated", "packages/bevy3d/rust"]
resolver = "2"

[patch.crates-io]
rnrs-core = { path = "rust/rnrs-core" }
rnrs = { path = "rust/rnrs" }
rnrs-surface = { path = "packages/surface/rust" }

[profile.release]
opt-level = 3
panic = "abort"
lto = false
